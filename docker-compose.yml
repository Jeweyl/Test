services:
  db:
    image: postgres:16
    expose: 
        - "5432"
    env_file: backend/.env

  db_test:
    image: postgres:16
    ports:
      - "5431:5432"
    env_file:
      - backend/.env 
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: db_test
      POSTGRES_PORT: 5432
      POSTGRES_DB: app_test

  redis:
    image: redis:7-alpine
    expose:
      - "6379"

  backend:
    build: "./backend"
    ports: 
        - "8000:8000"
    env_file: backend/.env
    volumes:
      - ./backend:/app
